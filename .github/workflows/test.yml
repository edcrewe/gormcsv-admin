name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, unit tests and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Match the packageManager field in package.json, which generated package-lock.json.
      - name: Install npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Angular specs
        run: npm test -- --watch=false

      # Before the API tests, so the bin test can start the built server.
      - name: Build
        run: npm run build

      - name: API tests
        run: npm run test:server

  integration:
    name: API tests against the real gormcsv
    runs-on: ubuntu-24.04
    services:
      # For the workspace integration test that imports into Postgres.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: gormcsv
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gormcsv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gormcsv -d gormcsv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Full history and tags so `make build` can stamp the git-describe version the health check expects.
      - name: Check out gormcsv
        uses: actions/checkout@v7
        with:
          repository: edcrewe/gormcsv
          ref: master
          path: gormcsv-src
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gormcsv-src/go.mod
          cache-dependency-path: gormcsv-src/go.sum

      - name: Build gormcsv
        run: make -C gormcsv-src build && gormcsv-src/gormcsv version

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install npm
        run: npm install --global npm@12.2.2

      - name: Install dependencies
        run: npm ci

      - name: API tests including real-CLI integration tests
        env:
          GORMCSV_BIN: ${{ github.workspace }}/gormcsv-src/gormcsv
          # Lets the workspace integration test build gormcsv from a worktree of this clone.
          GORMCSV_SRC_REPO: ${{ github.workspace }}/gormcsv-src
          GORMCSV_TEST_POSTGRES_DSN: postgres://gormcsv:ci-only-password@localhost:5432/gormcsv?sslmode=disable
        run: npm run test:server:it
